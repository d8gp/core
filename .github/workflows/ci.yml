name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew jvmTest

  # macOS minutes bill at 10x on private repos, so iOS runs on main and PRs only.
  ios:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew iosSimulatorArm64Test :ios-framework:assembleD8gpCoreXCFramework
